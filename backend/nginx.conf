# S-Clearance frontend server.
#
# Serves the built React app and reverse-proxies the REST API to the `api`
# container, so the browser always talks to one origin and no CORS headers or
# VITE_API_URL are needed.

# Docker's embedded DNS. The upstream is resolved per request (not at startup)
# so a restarted api container is picked up instead of leaving nginx with a
# stale container IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # The API host is resolved per request rather than at startup.
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Clearance uploads allow 5 files of 2 MB each, plus headroom.
    client_max_body_size 25m;

    # REST API. $request_uri is forwarded verbatim, so the FastAPI routes
    # under /api keep working unchanged.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Interactive API docs, handy while developing.
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
